name: 24-7 Minecraft Host Keeper
on:
  push:
  schedule:
    - cron: '0 */4 * * *' # Auto-triggers a fresh runner every 4 hours to bypass timeouts
  workflow_dispatch:      # Allows you to press a manual "Start" button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Mineflayer Connection Driver
        run: npm install mineflayer

      - name: Execute Bot Keepalive Loop
        run: node index.js

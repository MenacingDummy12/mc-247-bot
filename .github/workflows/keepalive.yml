name: 24-7 Minecraft Host Keeper

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Only one bot at a time. A new run waits for the current one to finish
# instead of killing it, so the bot never fights itself over the username.
concurrency:
  group: minecraft-keeper
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install latest mineflayer
        run: npm install mineflayer@latest --no-audit --no-fund

      - name: Show installed versions
        run: npm ls mineflayer minecraft-data minecraft-protocol || true

      - name: Run bot
        run: node index.js
        env:
          RUN_MINUTES: "340"

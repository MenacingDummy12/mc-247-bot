name: 24-7 Minecraft Host Keeper
on:
  push:
  schedule:
    - cron: '0 */4 * * *' 
  workflow_dispatch:      

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Mineflayer Connection Driver
        run: npm install mineflayer mineflayer-pathfinder express

      - name: Execute Bot Keepalive Loop
        run: node index.js
